<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../brand.css">
<style>
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;padding:84px 84px 76px;display:flex;flex-direction:column;margin:0 0 40px}
.kopf,.fuss{display:flex;justify-content:space-between;align-items:center;font-weight:500;font-size:27px;letter-spacing:.16em;text-transform:uppercase}
.fuss{letter-spacing:0;text-transform:none;font-weight:400}
.fuss .hint{font-weight:500;font-size:33px}
.kopf .nr{letter-spacing:.04em;font-variant-numeric:tabular-nums}
.mitte{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.hook{font-family:'Inter Tight';font-weight:600;line-height:1.08;letter-spacing:-.01em;margin:0}
.hook2{font-family:'Inter Tight';font-weight:600;line-height:1.12;letter-spacing:-.01em;margin:36px 0 0}
.wort{font-family:'Inter Tight';font-weight:600;font-size:200px;line-height:1;letter-spacing:-.015em;margin:0}
.h{font-family:'Inter Tight';font-weight:600;font-size:78px;line-height:1.12;letter-spacing:-.01em;margin:0 0 12px}
.body{font-size:50px;line-height:1.42;margin:32px 0 0}
.zwei{font-family:'Inter Tight';font-weight:600;font-size:94px;line-height:1.12;letter-spacing:-.01em;margin:0}
.vor{font-size:52px;line-height:1.4;margin:0}
.zahl{font-family:'Inter Tight';font-weight:600;font-size:200px;line-height:1.05;letter-spacing:-.015em;font-variant-numeric:tabular-nums;margin:20px 0 0}
.quelle{font-size:28px;line-height:1.45;margin:44px 0 0}
.rows{margin:44px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:32px;padding:30px 28px;border-top:2px solid;font-size:46px;line-height:1.25}
.row:last-child{border-bottom:2px solid}
.row .r{font-family:'Inter Tight';font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.balken{display:flex;height:84px;margin:56px 0 0}
.bl{display:flex;justify-content:space-between;gap:30px;margin:36px 0 0}
.lab{font-weight:500;font-size:27px;letter-spacing:.16em;text-transform:uppercase;margin:0}
.bw{font-family:'Inter Tight';font-weight:600;font-size:60px;font-variant-numeric:tabular-nums;margin:12px 0 0}
.boxen{display:flex;gap:36px;margin:56px 0 0}
.box{flex:1;padding:36px}
.wahl{display:flex;flex-direction:column}
.opt{display:flex;align-items:center;gap:40px;font-family:'Inter Tight';font-weight:600;font-size:88px;line-height:1.1;letter-spacing:-.01em}
.opt .ab{flex:none;width:116px;height:116px;border:3px solid;display:flex;align-items:center;justify-content:center;font-size:56px}
.oder{font-size:44px;margin:52px 0 52px 156px;letter-spacing:.08em}
.sig svg{width:120px;height:120px;display:block}
.endh{font-family:'Inter Tight';font-weight:600;font-size:84px;line-height:1.12;letter-spacing:-.01em;color:#fff;margin:56px 0 0}
.ends{font-size:48px;line-height:1.42;color:#D6DED8;margin:40px 0 0}
.note{font-size:27px;line-height:1.5;color:#D6DED8;margin:0 0 36px}
.hook,.hook2,.h,.zwei,.endh,.opt span{text-wrap:balance}
.body,.ends,.vor,.note{text-wrap:pretty}
</style>
</head>
<body>
<script src="common.js"></script>
<script src="posts.js"></script>
<script>
for (const post of POSTS.filter(p => p.typ === 'karussell')) {
  for (const s of karussell(post)) { const d = document.createElement('div'); d.className = 'slide'; d.id = s.id; d.style.background = s.bg; d.innerHTML = s.html; document.body.appendChild(d); }
}
</script>
</body>
</html>
